<style>
  :root { --bg:#f5f3ef; --card:#fff; --text:#222; --muted:#777; --accent:#6c4ab6; --accent2:#e9defb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:auto; padding:24px 16px 40px; }
  h1 { margin:0 0 6px; font-size:clamp(28px,6vw,44px); }
  .sub { color:var(--muted); margin:0 0 22px; }
  .panel { background:var(--card); border-radius:22px; padding:22px; box-shadow:0 8px 30px #0000000d; margin-bottom:16px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; }
  .stat { flex:1; min-width:130px; background:#f7f6f8; border-radius:16px; padding:13px; }
  .num { font-size:25px; font-weight:800; }
  .label { color:var(--muted); font-size:13px; }
  button { border:0; border-radius:14px; padding:13px 18px; font-weight:700; cursor:pointer; font-size:15px; }
  .primary { background:var(--accent); color:white; width:100%; font-size:18px; padding:16px; }
  .secondary { background:var(--accent2); color:var(--accent); }
  .danger { background:#fbe5e5; color:#a33; }
  .choices { display:grid; gap:12px; margin:18px 0; }
  .choice { border:2px solid #eee; border-radius:18px; padding:18px; background:white; }
  .choice.selected { border-color:var(--accent); background:#faf7ff; }
  .cat { color:var(--accent); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .activity { font-size:20px; font-weight:800; margin:6px 0 10px; }
  .hint { color:var(--muted); font-size:13px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions button { flex:1; min-width:150px; }
  .done-list { max-height:320px; overflow:auto; }
  .done-item { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
  .empty { color:var(--muted); text-align:center; padding:12px; }
  .tiny { font-size:12px; color:var(--muted); margin-top:10px; }
</style>

  <div class="panel">

      <div class="stat"><div class="num" id="total">0</div><div class="label">Total</div></div>
    </div>
  </div>

  <div class="panel">

    <div id="choices" class="choices"></div>
    <div class="actions" id="actions" style="display:none">
      <button class="secondary" id="redrawBtn">🔄 Sacar otras 3</button>
      <button class="primary" id="keepBtn">✅ Me quedo con esta</button>
    </div>
    <div class="tiny">Las actividades realizadas quedan guardadas en este navegador.</div>
  </div>

  <div class="panel">
    <h2>✅ Actividades realizadas</h2>
    <div id="doneList" class="done-list"></div>
    <button class="secondary" id="allBtn" style="margin-top:14px;width:100%">📋 Ver las 320 actividades</button><button class="danger" id="resetBtn" style="margin-top:8px;width:100%">♻️ Reiniciar todas</button><div id="allList" class="done-list" style="display:none;margin-top:14px"></div>
  </div>
</div>

const key="caja_experiencias_realizadas_v2_320";
let doneSet = new Set(JSON.parse(localStorage.getItem(key)||"[]"));
let current = [];

const $ = id => document.getElementById(id);

function save(){ localStorage.setItem(key, JSON.stringify([...doneSet])); }
function update(){
  $("available").textContent = activities.length-doneSet.size;
  $("done").textContent = doneSet.size;
  $("total").textContent = activities.length;
  const list=[...doneSet].map(i=>activities[i]).sort();
  $("doneList").innerHTML=list.length ? list.map((x,n)=>`<div class="done-item"><span>${x}</span><button class="secondary" onclick="undo(${activities.indexOf(x)})">↩️ Desmarcar</button></div>`).join("") : '<div class="empty">Aún no han realizado actividades.</div>';
}
function draw(){
  const available=activities.map((x,i)=>i).filter(i=>!doneSet.has(i));
  if(available.length===0){ $("choices").innerHTML='<div class="empty">🎉 ¡Han completado todas las actividades!</div>'; $("actions").style.display="none"; return; }
  const pool=[...available];
  current=[];
  while(current.length<Math.min(3,pool.length)){
    const p=Math.floor(Math.random()*pool.length);
    current.push(pool.splice(p,1)[0]);
  }
  render();
}
function render(){
  $("choices").innerHTML=current.map((i,n)=>`
    <div class="choice" data-i="${i}" onclick="selectChoice(${i})">
      <div class="cat">Opción ${n+1}</div>
      <div class="activity">${activities[i]}</div>
      <div class="hint">Haz clic aquí para elegirla.</div>
    </div>`).join("");
  $("actions").style.display="flex";
}
function selectChoice(i){
  document.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));
  const el=document.querySelector(`.choice[data-i="${i}"]`);
  if(el) el.classList.add("selected");
  current.selected=i;
}
function keep(){
  if(typeof current.selected!=="number"){ alert("Primero selecciona una de las tres actividades."); return; }
  doneSet.add(current.selected); save(); current=[]; $("choices").innerHTML=`<div class="empty">🎉 ¡Excelente!<br><strong>${activities[[...doneSet].at(-1)]}</strong><br>queda marcada como realizada.</div>`; $("actions").style.display="none"; update();
}
function undo(i){ if(i>=0){ doneSet.delete(i); save(); update(); } }
$("drawBtn").onclick=draw;
$("redrawBtn").onclick=draw;
$("keepBtn").onclick=keep;
$("resetBtn").onclick=()=>{ if(confirm("¿Reiniciar todas las actividades realizadas?")){ doneSet.clear(); save(); current=[]; $("choices").innerHTML=""; $("actions").style.display="none"; update(); }};
$("allBtn").onclick=()=>{
  const box=$("allList");
  if(box.style.display==="none"){
    box.style.display="block";
    box.innerHTML=activities.map((x,i)=>`<div class="done-item"><span><strong>${i+1}.</strong> ${x}</span><span>${doneSet.has(i)?"✅":""}</span></div>`).join("");
    $("allBtn").textContent="🙈 Ocultar actividades";
  } else {
    box.style.display="none";
    $("allBtn").textContent="📋 Ver las 320 actividades";
  }
};
update();
</script>
